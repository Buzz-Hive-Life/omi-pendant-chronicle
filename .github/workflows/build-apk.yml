name: Build pendant APK

# ⚠️ WHY THIS FILE EXISTS: the fork cannot be compiled where it was written — no JDK, no Gradle, no Android
# SDK. GitHub's runners have the Android SDK; this turns "here is a patch" into "here is an installable APK".

on:
  workflow_dispatch:
  push:
    branches: [ hive ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure the Hive sink
        working-directory: android-app
        run: |
          # local.properties is git-ignored; CI writes it from repository secrets so the URL and the pipe
          # secret never live in the tree. ⚠️ The secret IS embedded in the APK — that is the app's design.
          # ⚠️ A MISSING SECRET MUST NOT FAIL THE BUILD — it must build and be DIAGNOSABLE. An APK with an
          # empty secret authenticates as nobody, and the pipe answers 403 with a named refusal, which is a
          # far better symptom than a mysterious build failure.
          {
            echo "agent.url=https://omi-ingest-production.up.railway.app/raw"
            echo "pendant.secret=${{ secrets.OMI_PIPE_SECRET }}"
          } > local.properties
          if [ -z "${{ secrets.OMI_PIPE_SECRET }}" ]; then
            echo "::warning title=No pipe secret::OMI_PIPE_SECRET is unset — this APK WILL build but the pipe will refuse its posts (403). Add the secret and re-run."
          fi

      - name: Generate a throwaway signing key
        run: |
          # ⚠️ Exists only for this job. Never stored, never committed. A release APK must be SIGNED to be
          # installable, and a personal build needs an installable artifact, not a distributable identity.
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/hive-release.jks" \
            -alias hive -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hivepass -keypass hivepass \
            -dname "CN=Hive Pendant, OU=Hive Life Haven, O=Hive, L=Riverview, ST=NB, C=CA"

      - name: Build
        working-directory: android-app
        env:
          HIVE_KEYSTORE: ${{ github.workspace }}/hive-release.jks
          HIVE_KS_PASS: hivepass
          HIVE_KEY_PASS: hivepass
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 || true
          fi
          # release is the small, installable one (R8 strips the bulk); debug stays for diagnosing
          ./gradlew --no-daemon assembleRelease
          ./gradlew --no-daemon assembleDebug || true

      - name: Unit tests — the ring command encoders
        working-directory: android-app
        run: |
          # A wrong length is what the firmware answers with ACK status 6 (INVALID_COMMAND), so the byte
          # lengths are asserted here rather than discovered on a pendant.
          ./gradlew --no-daemon testDebugUnitTest

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: pendant-apk
          path: android-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
